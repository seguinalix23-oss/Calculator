<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scriptcalc.js"></script>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<h1> Calculatrix </h1>
<div> id = "calcultr"
    <!-- on ajoute une zone pour l'écran "screen" et il affichera les opérations avec "display", soit le résultat "result"-->
    <div> class = "screen" 
         <div>id="display"</div>     
    </div>

    <div> id = "keybrd"
        <button class = "btnNum" id="0" type = "button">0</button>
        <button class = "btnNum" id="1" type = "button">1</button>
        <button class = "btnNum" id="2" type = "button">2</button>
        <button class = "btnNum" id="3" type = "button">3</button>
        <button class = "btnNum" id="4" type = "button">4</button>
        <button class = "btnNum" id="5" type = "button">5</button>
        <button class = "btnNum" id="6" type = "button">6</button>
        <button class = "btnNum" id="7" type = "button">7</button>
        <button class = "btnNum" id="8" type = "button">8</button>
        <button class = "btnNum"  id="9" type = "button">9</button>
        <button id="plus" type = "button">+</button>
        <button id="moins" type = "button">-</button>
        <button id="div" type = "button">/</button>
        <button id="mult" type = "button">x</button>
        <button id="egal" type = "button">=</button>
        <button id="cancel" type = "reset">C</button>

    </div>

</div>
</body>
</html>
