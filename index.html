<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrix</title>
    <script src="scriptcalc.js" defer></script>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<h1>Calculatrix</h1>

<!-- Tableau principal de la calculatrice -->
<table id="calcultr">
    
    <!-- Zone d'affichage (Écran) : Affiche 0 par défaut -->
    <tr>
        <td colspan="4" id="screen">0</td>
    </tr>
    
    <!-- Zone du clavier -->
    <tr>
        <td colspan="4">
            <table id="keybrd">
                <tr>
                    <td><button class="btnNum" id="1" type="button">1</button></td>
                    <td><button class="btnNum" id="2" type="button">2</button></td>
                    <td><button class="btnNum" id="3" type="button">3</button></td>
                    <td><button class="btnOp" id="Virgule" type="button">,</button></td>
                </tr>
                <tr>
                    <td><button class="btnNum" id="4" type="button">4</button></td>
                    <td><button class="btnNum" id="5" type="button">5</button></td>
                    <td><button class="btnNum" id="6" type="button">6</button></td>
                    <td><button class="btnCan" id="cancel" type="reset">C</button></td>
                </tr>
                <tr>
                    <td><button class="btnNum" id="7" type="button">7</button></td>
                    <td><button class="btnNum" id="8" type="button">8</button></td>
                    <td><button class="btnNum" id="9" type="button">9</button></td>
                    <td><button class="btnNum" id="0" type="button">0</button></td>
                    
                </tr>
                <tr>
                    <td><button class="btnOp" id="div" type="button">/</button></td>
                    <td><button class="btnOp" id="plus" type="button">+</button></td>
                    <td><button class="btnOp" id="moins" type="button">-</button></td>
                    <td><button class="btnOp" id="mult" type="button">x</button></td>
                </tr>
                <tr> 
                    <td><button class="btnEgal" id="egal" type="button">=</button></td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
